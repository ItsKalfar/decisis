[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ItsKalfar/decisis"

[workspace.dependencies]
decisis-core = { path = "crates/decisis-core", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"